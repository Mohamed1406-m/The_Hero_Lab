<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'dashboard:home' %}">
            <i class="bi bi-lightning-charge-fill"></i> MuscleForge AI
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="ms-auto d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                <a href="{% url 'notifications:list' %}" class="btn btn-outline-secondary btn-sm position-relative">
                    <i class="bi bi-bell"></i>
                    {% if notification_count > 0 %}
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:0.6rem;">
                        {{ notification_count }}
                    </span>
                    {% endif %}
                </a>

                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                        <img src="{{ user.avatar_url }}" class="avatar-img" alt="">
                        <span>{{ user.username }}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" href="{% url 'accounts:change_password' %}"><i class="bi bi-shield-lock me-2"></i>Change Password</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item text-danger" href="#" onclick="document.getElementById('logout-form').submit();">
                                <i class="bi bi-box-arrow-right me-2"></i>Logout
                            </a>
                        </li>
                    </ul>
                </div>
                <form id="logout-form" method="post" action="{% url 'accounts:logout' %}" class="d-none">{% csrf_token %}</form>
                {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary btn-sm">Login</a>
                <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">Get Started</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
